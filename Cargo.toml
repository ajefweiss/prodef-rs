[package]
name = "prodef"
version = "0.3.1"
edition = "2024"

authors = ["Andreas J. Weiss <ajefweiss@gmail.com>"]
description = "A simple Rust crate for handling probability distributions."
homepage = "https://github.com/ajefweiss/prodef-rs/"
repository = "https://github.com/ajefweiss/prodef-rs/"
readme = "README.md"
license = "MIT"

[package.metadata.docs.rs]
features = ["pyo3"]

[dependencies]
approx = "0.5.1"
derive_more = { version = "2.1.1", features = ["full"] }
itertools = "0.15.0"
log = "0.4.33"
nalgebra = { version ="0.34.2", features = ["rayon", "serde-serialize"] }
num-traits = "0.2.19"
numpy = { version = "0.29.0", features = ["nalgebra"], optional = true }
pyo3 = { version = "0.29.2", features = ["multiple-pymethods", "extension-module"], optional = true }
rand = "0.10.2"
rand_distr = "0.6.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_arrays = "0.2.0"
thiserror = "2.0.20"

[dev-dependencies]
approx = "0.5.1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "multivariate"
harness = false

[[bench]]
name = "multinormal"
harness = false

[[bench]]
name = "particle"
harness = false

[[bench]]
name = "kent"
harness = false

[features]
pyo3 = ["dep:numpy", "dep:pyo3"]
pyo3_f32 = ["pyo3"]
